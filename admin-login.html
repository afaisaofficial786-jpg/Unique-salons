<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Unique Salons</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ADMIN LOGIN -->
    <section class="admin-login">

        <div class="login-box">

            <div class="logo">
                UNIQUE <span>SALONS</span>
            </div>

            <p class="section-small">ADMIN PANEL</p>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Login to manage salon appointments.
            </p>


            <form id="adminLoginForm">

                <div class="login-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="login-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>


            <a href="index.html" class="back-home">
                ← Back to Website
            </a>

        </div>

    </section>


    <script src="admin-login.js"></script>

</body>
</html>
